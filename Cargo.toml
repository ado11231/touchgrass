[package]
name = "touchgrass"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Track active time in your dev tools"
license = "MIT"
authors = ["ado11231 <adoalagic0@gmail.com>"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
missing_docs = "warn"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
