[package]
name = "touchgrass"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
description = "Track active time in your dev tools"
license = "MIT"
repository = "https://github.com/ado11231/touchgrass"
authors = ["ado11231 <adoalagic0@gmail.com>"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
missing_docs = "warn"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ctrlc = { version = "3", features = ["termination"] }
dirs = "7"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
terminal_size = "0.4"
toml = "1"
